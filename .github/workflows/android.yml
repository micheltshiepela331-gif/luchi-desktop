name: Automatisation APK Luchi-Desktop

on:
  push:
    branches:
      - main # Le robot se lance dès que vous poussez des modifications sur main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Compilation de l'APK Luchi-Desktop
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleRelease
          else
            echo "Aucun fichier gradlew détecté. Tentative de compilation alternative."
          fi

      - name: Envoi de l'APK vers le site web
        env:
          API_TOKEN_GITHUB: ${{ secrets.AUTO_DEPLOY_TOKEN }}
        run: |
          git config --global user.name "Robot Luchi Desktop"
          git config --global user.email "robot-desktop@github.com"
          
          # Clonage de votre site internet
          git clone https://x-access-token:${API_TOKEN_GITHUB}@://github.com site_web
          
          # Création du sous-dossier pour cette application sur le site
          mkdir -p site_web/apks/luchi-desktop
          
          # Copie de l'APK produit
          cp app/build/outputs/apk/release/app-release.apk site_web/apks/luchi-desktop/luchi-desktop.apk || cp *.apk site_web/apks/luchi-desktop/luchi-desktop.apk
          
          # Commit et push automatique vers votre site
          cd site_web
          git add .
          git commit -m "Mise à jour automatique de l'APK : Luchi-Desktop"
          git push origin main
