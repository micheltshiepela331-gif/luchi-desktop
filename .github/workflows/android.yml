name: Build and Deploy APK

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Compilation de l'APK Luchi-Desktop
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleRelease
          else
            echo "Aucun fichier gradlew detecte. Tentative de compilation alternative."
          fi

      - name: Envoi de l'APK vers le site web
        run: |
          git config --global user.name "Robot Luchi Desktop"
          git config --global user.email "robot-desktop@github.com"
          
          git clone https://x-access-token:${{ secrets.AUTO_DEPLOY_TOKEN }}@github.com/MICHEL-2004/luchi-site-web.git site_web
          
          mkdir -p site_web/apks/luchi-desktop
          
          cp app/build/outputs/apk/release/app-release.apk site_web/apks/luchi-desktop/luchi-desktop.apk || cp app/build/outputs/apk/release/*.apk site_web/apks/luchi-desktop/
          
          cd site_web
          git add .
          git commit -m "Mise à jour automatique de l'APK : Luchi-Desktop" || echo "Rien de nouveau a committer"
          git push origin main
