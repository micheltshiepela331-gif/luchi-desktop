name: Build and Deploy APK
on:
  push:
    branches: [main]
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Compilation APK
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleRelease
          fi
      - name: Deployer APK
        run: |
          git config --global user.name "Robot Luchi"
          git config --global user.email "robot@luchi.com"
          mkdir -p apks/luchi-desktop
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk apks/luchi-desktop/luchi-desktop.apk
          fi
          git add apks/ || true
          git commit -m "APK Luchi-Desktop" || echo "rien"
          git push origin main
